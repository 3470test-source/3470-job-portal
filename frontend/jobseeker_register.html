<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3470 Healthcare & Training Institutes Job portal - Register Job seeker</title>

    <!-- Favicon -->
    <link rel="icon" href="/image/Logo3470-health3-removebg-preview.png" type="image/x-icon">
    
    <link rel="stylesheet" href="styles.css" />

    <!-- Font Awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    </style>

</head>
<body>
  
<div class="jobseeker-register-container">

    <!-- LEFT INFO BOX -->
    <div class="jobseeker-register-left">
        <img src="/image/Logo3470-health3-removebg-preview.png" class="jobseeker-register-logo">
        <h3>On registering, you can</h3>
        <ul class="jobseeker-register-benefits">
            <li><i class="fa-solid fa-circle-check"></i> Build your profile and let recruiters find you</li>
            <li><i class="fa-solid fa-circle-check"></i> Get job postings delivered to your email</li>
            <li><i class="fa-solid fa-circle-check"></i> Find a job and grow your career</li>
        </ul>
    </div>

    <!-- RIGHT FORM BOX -->
    <div class="jobseeker-register-right">
        <div class="jobseeker-register-card">
            <h2>Jobseeker Account Registration</h2>

            <form id="registerForm" class="jobseeker-register-form">

                <div class="jobseeker-input-group">
                    <label>Full Name</label>
                    <input type="text" id="name" required>
                    <small class="error"></small>
                </div>

                <div class="jobseeker-input-group">
                    <label>Email ID</label>
                    <input type="email" id="email" required>
                    <small class="error"></small>
                </div>

                <div class="jobseeker-input-group">
                    <label>Phone NO</label>
                    <input type="tel" id="phone" pattern="[6-9]{1}[0-9]{9}" maxlength="10" required>
                    <small class="error"></small>
                </div>

                <div class="jobseeker-input-group">
                    <label>Password</label>
                      <div class="password-wrapper-icon">    
                        <input type="password" class="password-icon-btn" id="password"minlength="6" required>
                        <i class="fa-solid fa-eye toggle-password" data-target="password"></i>
                      </div>    
                    <small class="error"></small>
                </div>

                <div class="jobseeker-input-group">
                    <label>Confirm Password</label>
                      <div class="password-wrapper-icon">
                        <input type="password" class="password-icon-btn" id="confirmPassword" minlength="6" required>
                        <i class="fa-solid fa-eye toggle-password" data-target="confirmPassword"></i>
                      </div>
                    <small class="error"></small>
                </div>

                <div class="jobseeker-input-group">
                    <label>Upload Resume (PDF only)</label>
                    <input type="file" id="resume" accept=".pdf" required>
                </div>

                <button type="submit" class="jobseeker-register-btn">Register</button>

                <p class="jobseeker-login-link">
                    Already have an account?
                    <a href="/frontend/jobseeker_login.html">Login</a>
                </p>

            </form>
        </div>
    </div>

</div>


<!-- Javascript --> 
<script src="/frontend/main.js" defer></script>    

<!-- Stylish Popup (SweetAlert) -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- Password Icon hide / unhide -->
<script>
    document.querySelectorAll(".toggle-password").forEach(icon => {
    icon.addEventListener("click", () => {
        const inputId = icon.getAttribute("data-target");
        const input = document.getElementById(inputId);

        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            input.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    });
});
</script>





<script>
  document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const resume = document.getElementById("resume").files[0];

  // Validation
  if (!name || !email || !phone || !password || !confirmPassword || !resume) {
    Swal.fire("Error ❌", "All fields are required", "error");
    return;
  }

  if (password !== confirmPassword) {
    Swal.fire("Error ❌", "Passwords do not match", "error");
    return;
  }

  if (resume.type !== "application/pdf") {
    Swal.fire("Error ❌", "Only PDF resume allowed", "error");
    return;
  }

  try {
    const formData = new FormData();
    formData.append("name", name);
    formData.append("email", email);
    formData.append("phone", phone);
    formData.append("password", password);
    formData.append("resume", resume);

    const response = await fetch("http://localhost:3000/register", {
      method: "POST",
      body: formData
    });

    const data = await response.json();

    if (response.ok) {
      Swal.fire({
        title: "Registration Successful 🎉",
        text: "Your account has been created!",
        icon: "success"
      }).then(() => {
        window.location.href = "/frontend/jobseeker_login.html";
      });
    } else {
      Swal.fire("Error ❌", data.message || "Registration failed", "error");
    }

  } catch (error) {
    console.error(error);
    Swal.fire("Error ❌", "Server error", "error");
  }
});
</script>







</body>
</html>
