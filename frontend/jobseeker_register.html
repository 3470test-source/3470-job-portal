<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3470 Healthcare & Training Institutes Job portal - Register Job seeker</title>

    <!-- Favicon -->
    <link rel="icon" href="/image/Logo3470-health3-removebg-preview.png" type="image/x-icon">
    
    <link rel="stylesheet" href="styles.css" />

    <!-- Font Awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    </style>

</head>
<body>
  
<div class="jobseeker-register-container">

    <!-- LEFT INFO BOX -->
    <div class="jobseeker-register-left">
        <img src="/image/Logo3470-health3-removebg-preview.png" class="jobseeker-register-logo">
        <h3>On registering, you can</h3>
        <ul class="jobseeker-register-benefits">
            <li><i class="fa-solid fa-circle-check"></i> Build your profile and let recruiters find you</li>
            <li><i class="fa-solid fa-circle-check"></i> Get job postings delivered to your email</li>
            <li><i class="fa-solid fa-circle-check"></i> Find a job and grow your career</li>
        </ul>
    </div>

    <!-- RIGHT FORM BOX -->
    <div class="jobseeker-register-right">
        <div class="jobseeker-register-card">
            <h2>Jobseeker Account Registration</h2>

            <form id="registerForm" class="jobseeker-register-form" enctype="multipart/form-data">

                <div class="jobseeker-input-group">
                    <label>Full Name</label>
                    <input type="text" id="name" required>
                    <small class="error"></small>
                </div>

                <div class="jobseeker-input-group">
                    <label>Email ID</label>
                    <input type="email" id="email" required>
                    <small class="error"></small>
                </div>

                <div class="jobseeker-input-group">
                    <label>Phone NO</label>
                    <input type="tel" id="phone" pattern="[6-9]{1}[0-9]{9}" maxlength="10" required>
                    <small class="error"></small>
                </div>

                <div class="jobseeker-input-group">
                    <label>Password</label>
                      <div class="password-wrapper-icon">    
                        <input type="password" class="password-icon-btn" id="password"minlength="6" required>
                        <i class="fa-solid fa-eye toggle-password" data-target="password"></i>
                      </div>    
                    <small class="error"></small>
                </div>

                <div class="jobseeker-input-group">
                    <label>Confirm Password</label>
                      <div class="password-wrapper-icon">
                        <input type="password" class="password-icon-btn" id="confirmPassword" minlength="6" required>
                        <i class="fa-solid fa-eye toggle-password" data-target="confirmPassword"></i>
                      </div>
                    <small class="error"></small>
                </div>

                <div class="jobseeker-input-group">
                    <label>Upload Resume (PDF only)</label>
                    <input type="file" id="resume" accept=".pdf" required>
                </div>

                <button type="submit" id="submitBtn" class="jobseeker-register-btn">Register</button>

                <p class="jobseeker-login-link">
                    Already have an account?
                    <a href="/frontend/jobseeker_login.html">Login</a>
                </p>

            </form>
        </div>
    </div>

</div>


<!-- Javascript --> 
<!-- <script src="/frontend/main.js" defer></script>     -->

<!-- Stylish Popup (SweetAlert) -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- Password Icon hide / unhide -->
<script>
    document.querySelectorAll(".toggle-password").forEach(icon => {
    icon.addEventListener("click", () => {
        const inputId = icon.getAttribute("data-target");
        const input = document.getElementById(inputId);

        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            input.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    });
});
</script>



<script>
const BASE_URL = "http://localhost:3000";

const form = document.getElementById("registerForm");
const btn = document.getElementById("submitBtn");

form.addEventListener("submit", async function (e) {
  e.preventDefault();

  console.log("FORM SUBMIT STARTED"); // debug

  // 🔒 prevent double click
  btn.disabled = true;

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const phone = document.getElementById("phone").value;
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const resumeFile = document.getElementById("resume").files[0];

  // ❌ Password mismatch
  if (password !== confirmPassword) {
    btn.disabled = false;
    return Swal.fire("Error ❌", "Passwords do not match", "error");
  }

  // ❌ Resume check
  if (!resumeFile) {
    btn.disabled = false;
    return Swal.fire("Error ❌", "Upload resume", "error");
  }

  // FormData
  const formData = new FormData();
  formData.append("name", name);
  formData.append("email", email);
  formData.append("phone", phone);
  formData.append("password", password);
  formData.append("resume", resumeFile);

  try {
    const res = await fetch(`${BASE_URL}/api/register`, {
      method: "POST",
      body: formData
    });


    console.log("Status:", res.status);



    // const data = await res.json();



   let data = {};

try {
  data = await res.json();
} catch (e) {
  console.error("Invalid JSON:", e);
  data.message = "Server response error";
}

  console.log("Response Data:", data);


    if (res.ok) {
      await Swal.fire({
        title: "Success 🎉",
        text: data.message,
        icon: "success",
        confirmButtonText: "Go to Login"
      });

      window.location.href = "/frontend/jobseeker_login.html";

    } else {
      Swal.fire("Error ❌", data.message, "error");
      btn.disabled = false;
    }

  } catch (err) {
  console.error("Catch Error:", err);

  Swal.fire({
    title: "Error ❌",
    text: err.message || "Something went wrong",
    icon: "error"
  });

  btn.disabled = false;
}
});

</script>


</body>
</html>
