<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3470 Healthcare & Training Institutes Job portal - Register Job seeker</title>

    <!-- Favicon -->
    <link rel="icon" href="/image/Logo3470-health3-removebg-preview.png" type="image/x-icon">
    
    <link rel="stylesheet" href="styles.css" />

    <!-- Stylish Popup (SweetAlert) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Font Awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    </style>

</head>
<body>
  
<div class="jobseeker-register-container">

    <!-- LEFT INFO BOX -->
    <div class="jobseeker-register-left">
        <img src="/image/Logo3470-health3-removebg-preview.png" class="jobseeker-register-logo">
        <h3>On registering, you can</h3>
        <ul class="jobseeker-register-benefits">
            <li><i class="fa-solid fa-circle-check"></i> Build your profile and let recruiters find you</li>
            <li><i class="fa-solid fa-circle-check"></i> Get job postings delivered to your email</li>
            <li><i class="fa-solid fa-circle-check"></i> Find a job and grow your career</li>
        </ul>
    </div>

    <!-- RIGHT FORM BOX -->
    <div class="jobseeker-register-right">
        <div class="jobseeker-register-card">
            <h2>Jobseeker Account Registration</h2>

            <form id="jobseeker-registerForm" class="jobseeker-register-form">

                <div class="jobseeker-input-group">
                    <label>Full Name</label>
                    <input type="text" id="name" name="name" required>
                    <small class="error"></small>
                </div>

                <div class="jobseeker-input-group">
                    <label>Email ID</label>
                    <input type="email" id="email" name="email" required>
                    <small class="error"></small>
                </div>

                <div class="jobseeker-input-group">
                    <label>Phone NO</label>
                    <input type="tel" id="phone" name="phone" pattern="[6-9]{1}[0-9]{9}" maxlength="10" required>
                    <small class="error"></small>
                </div>

                <div class="jobseeker-input-group">
                    <label>Password</label>
                      <div class="password-wrapper-icon">    
                        <input type="password" class="password-icon-btn" id="password" name="password" minlength="6" required>
                        <i class="fa-solid fa-eye toggle-password" data-target="password"></i>
                      </div>    
                    <small class="error"></small>
                </div>

                <div class="jobseeker-input-group">
                    <label>Confirm Password</label>
                      <div class="password-wrapper-icon">
                        <input type="password" class="password-icon-btn" id="confirmPassword" name="confirmPassword" minlength="6" required>
                        <i class="fa-solid fa-eye toggle-password" data-target="confirmPassword"></i>
                      </div>
                    <small class="error"></small>
                </div>

                <div class="jobseeker-input-group">
                    <label>Upload Resume (PDF only)</label>
                    <input type="file" id="resume" name="resume" accept=".pdf" required>
                </div>

                <button type="submit" class="jobseeker-register-btn">Register</button>

                <p class="jobseeker-login-link">
                    Already have an account?
                    <a href="/frontend/jobseeker_login.html">Login</a>
                </p>

            </form>
        </div>
    </div>

</div>


<!-- Password Icon hide / unhide -->
<script>
    document.querySelectorAll(".toggle-password").forEach(icon => {
    icon.addEventListener("click", () => {
        const inputId = icon.getAttribute("data-target");
        const input = document.getElementById(inputId);

        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            input.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    });
});
</script>

<script>
document.getElementById("jobseeker-registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (password !== confirmPassword) {
    Swal.fire({
      icon: "error",
      title: "Error",
      text: "Passwords do not match ❌"
    });
    return;
  }

  const formData = new FormData();

  formData.append("name", document.getElementById("name").value);
  formData.append("email", document.getElementById("email").value);
  formData.append("phone", document.getElementById("phone").value);
  formData.append("password", password);
  formData.append("confirmPassword", confirmPassword);
  formData.append("resume", document.getElementById("resume").files[0]);

  try {
    const res = await fetch("http://localhost:3000/register", {
      method: "POST",
      body: formData
    });

    const result = await res.json();

    if (res.ok) {
      Swal.fire({
        icon: "success",
        title: "Success",
        text: result.message
      }).then(() => {
        window.location.href = "/frontend/jobseeker_login.html";
      });
    } else {
      Swal.fire({
        icon: "error",
        title: "Error",
        text: result.message
      });
    }

  } catch (error) {
    Swal.fire({
      icon: "error",
      title: "Server Error",
      text: "Something went wrong ❌"
    });
  }
});
</script>

</body>
</html>
