<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />

  <title>3470 Healthcare & Training Institutes Job portal - Employer Dashborad</title>

    <!-- Favicon -->

  <style>

    * {
      box-sizing:border-box;
    }

    body {
      background: linear-gradient(to right, #eef2f3, #dfe9f3);
      margin: 0;
      padding: 20px;
    }







/*--- Container ---*/
.applicants-container {
  margin-top: 20px;
}

/*--- Card ---*/
.applicant-card {
  background: #fff;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  transition: 0.3s;
}

.applicant-card:hover {
  transform: translateY(-3px);
}

/*--- Header ---*/
.applicant-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.applicant-header h4 {
  font-size: 18px;
  margin-bottom: 10px;
}

.applicant-header p {
  font-size: 18px;
}

.applicant-header i,
.applicant-cal i,
.applicant-resume i {
  color:#0672ca;
  font-size: 18px;
  margin-right: 8px;
}

.applicant-header h4,
.applicant-cal,
.applicant-resume {
  display: flex;
  align-items: center;
  gap: 6px; /* modern spacing */
}

/*--- Status Badge ---*/
.status-badge {
  padding: 5px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: bold;
}

.status-badge.applied {
  background: orange;
  color: white;
}

.status-badge.shortlisted {
  background: green;
  color: white;
}

.status-badge.rejected {
  background: red;
  color: white;
}

/*--- Buttons ---*/
.filter-buttons button {
  margin: 5px;
  padding: 6px 12px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  background: #007bff;
  color: white;
}

.filter-buttons button:hover {
  background: #0056b3;
}

/*--- Resume link ---*/
.applicant-card a {
  color: #087a41;
  text-decoration: none;
  font-size: 18px;
  font-weight: bold;
}

.applicant-card a:hover {
  text-decoration: underline;
}

.status-container {
  margin-top: -10px;
}

.status-container label {
  font-weight: 600;
  margin-right: 10px;
  font-size: 18px;
}

.status-container select {
  padding: 8px 16px;
  border-radius: 6px;
  background-color: #fff;
  font-size: 14px;
  cursor: pointer;
  outline: none;
  transition: all 0.3s ease;
}

.status-container select:hover {
  border-color: #007bff;
}

.status-container select:focus {
  border-color: #007bff;
  box-shadow: 0 0 5px rgba(0, 123, 255, 0.4);
}

/*--- Disabled ---*/
.status-container select:disabled {
  background-color: #f5f5f5;
  cursor: not-allowed;
}


  </style>

</head>

<body>

<!-- Post a Job -->
<div class="form-wrapper-employer">  
  <div class="form-container-employer">
    <h2>Employer Post a Job</h2>

    <div class="form-group-post-job">

    <div class="form-group-post-job">

    <div class="form-group-post-job">
      <label>Salary</label>
      <input type="text" id="salary" placeholder="Salary (e.g. 4-6 LPA)" />
    </div>

    <!-------- Industry -------->
    <div class="form-group-post-job">
      <label>Industry</label>
      <select id="industry">
        <option value="">-- Select Industry --</option>

        <option>IT Services & Consulting</option>

    <!-------- Department -------->
    <div class="form-group-post-job">
      <label>Department</label>
      <select id="department">
        <option value="">-- Select Department --</option>
            <!-- IT / Software -->
        <option>Software Development</option>

        <option>Data Science / Analytics</option>

            <!-- Healthcare -->
        <option>Medical Services</option>
        <option>Nursing</option>
        <option>Pharmacy</option>

        <option>Medical Coding & Billing</option>

            <!-- Business -->
        <option>Human Resources (HR)</option>

        <option>Finance & Accounts</option>
        <option>Customer Support</option>
        <option>Operations</option>
            <!-- Others -->
        <option>Logistics & Supply Chain</option>
        <option>Teaching / Education</option>

      </select>
    </div>

    <!----- Job Type ----->
    <div class="form-group-post-job">
      <label>Job Type</label>
      <select id="jobType">
        <option value="">-- Select Job Type --</option>
           <!-- Main Types -->
        <option>Full Time</option>

        <option>Temporary</option>

        <option>Remote</option>

      </select>
    </div>

    <!-------- Role Category -------->
    <div class="form-group-post-job">
      <label>Role Category</label>
      <select id="category">
        <option value="">-- Select Category --</option>
            <!-- IT / Software -->
        <option>QA / Testing</option>
        <option>Software Development</option>
        <option>DevOps</option>
        <option>UI / UX Design</option>
        <option>Data Science / Analytics</option>
            <!-- Healthcare -->
        <option>Doctor</option>
        <option>Nurse</option>
        <option>Pharmacist</option>
        <option>Lab Technician</option>
        <option>Radiologist</option>
        <option>Medical Coding</option>
        <option>Medical Billing</option>
        <option>Hospital Administration</option>
        <option>Healthcare Support Staff</option>
            <!-- Business -->
        <option>HR</option>
        <option>Sales</option>
        <option>Marketing</option>
        <option>Finance / Accounts</option>
        <option>Customer Support</option>

    <div class="form-group-post-job">
      <label>Education</label>
      <input type="text" id="education" placeholder="BCA / MCA / Any Graduate" />
    </div>

    <div class="form-group-post-job">
      <label>Skills</label>
      <input type="text" id="skills" placeholder="Skills (comma separated)" />
    </div>

    <!-- Job Highlights -->
    <div class="form-group-post-job job-post">
      <label>Job Highlights</label>
      <div id="highlightsEditor" style="height: 120px;"></div>
    </div>

    <!-- Job Description -->
    <div class="form-group-post-job job-post">
      <label>Job Description</label>
      <div id="descriptionEditor" style="height: 200px;"></div>

    <button onclick="postJob()">Post Job</button>
  </div>
</div>

  <!-- JOB LIST -->
  <div class="jobs-section-employer-dash">
    <h2>Posted Jobs</h2>
    <div id="employerJobs" class="job-employer-grid"></div>

    <h2>Applicants</h2>

    <!-- Filter Buttons -->
    <div class="filter-buttons">
      <button onclick="filterApplicants('ALL')">All</button>
      <button onclick="filterApplicants('APPLIED')">Applied</button>
      <button onclick="filterApplicants('SHORTLISTED')">Shortlisted</button>
      <button onclick="filterApplicants('REJECTED')">Rejected</button>
    </div>

    <!-- Applicant Count -->
    <p id="applicantCount"></p>

    <!-- Applicant List -->
    <div id="applicantsList" class="applicants-container"></div>

  </div>


<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

<script>

const applicantsList = document.getElementById("applicantsList");

const applicantCount = document.getElementById("applicantCount");
let allApplicants = [];

let currentJobId = null;


/* ================= PREVIEW ================= */
  
  function previewLogo() {
  const fileInput = document.getElementById("logo");
  const preview = document.getElementById("preview");

  const file = fileInput.files[0];

  if (file) {
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
  }
}



  async function postJob() {

    const title = document.getElementById("title").value;
    const company = document.getElementById("company").value;

    if (!title || !company) {
      alert("Title and Company are required!");
      return;
    }

    const formData = new FormData();

    formData.append("title", title);
    formData.append("company", company);
    formData.append("experience", document.getElementById("experience").value);
    formData.append("location", document.getElementById("location").value);
    formData.append("salary", document.getElementById("salary").value);
    formData.append("skills", document.getElementById("skills").value);
    formData.append("industry", document.getElementById("industry").value);
    formData.append("department", document.getElementById("department").value);
    formData.append("jobType", document.getElementById("jobType").value);
    formData.append("category", document.getElementById("category").value);
    formData.append("education", document.getElementById("education").value);
    
    formData.append("highlights", highlightsQuill.root.innerHTML);
    formData.append("description", descriptionQuill.root.innerHTML);
    

    const file = document.getElementById("logo").files[0];
    if (file) {
      formData.append("logo", file);
    }

    try {
      const res = await fetch("http://localhost:3000/jobs", {
        method: "POST",
        body: formData
      });

      const data = await res.json();

      alert("✅ " + data.message);

      /*----- 🔥 Clear form -----*/
      // document.querySelectorAll("input, textarea, select").forEach(el => el.value = "");
      document.querySelectorAll("input, select").forEach(el => el.value = "");
      highlightsQuill.root.innerHTML = "";
      descriptionQuill.root.innerHTML = "";
      document.getElementById("preview").style.display = "none";

    } catch (err) {
      alert("❌ Error posting job");
      console.error(err);
    }
  }

</script>


<script>

/*----- 🔥 Load jobs -----*/
async function loadEmployerJobs() {

  try {
    const res = await fetch("http://localhost:3000/jobs");

    if (!res.ok) throw new Error("Failed to fetch");

  const jobs = await res.json();

  const container = document.getElementById("employerJobs");
  container.innerHTML = "";

  if (!jobs.length) {
      container.innerHTML = "<p>No jobs posted yet</p>";
      return;
    }

  jobs.forEach(job => {

    const div = document.createElement("div");
    div.classList.add("job-card-employer");

    /*--- convert skills string → array ---*/
    const skills = job.skills ? job.skills.split(",") : [];

    div.innerHTML = `
      <div class="job-header-employer">

       <img 
          src="${job.logo ? 'http://localhost:3000/uploads/' + job.logo : 'https://via.placeholder.com/50'}"
          onerror="this.src='https://via.placeholder.com/50'"
          alt="logo"
       />

       <div>
         <p class="job-title-employer">${job.title}</p>
         <p class="company-name-employer">${job.company}</p>
       </div>

      </div>

      <div class="job-info-employer">
        <p><i class="fa-solid fa-location-dot"></i> ${job.location}</p>
        <p><i class="fa-solid fa-indian-rupee-sign"></i> ${job.salary}</p>
        <p><i class="fa-solid fa-briefcase"></i> ${job.experience || "Not specified"} Experience</p>
      </div>

      <div class="skills-employer">
        <b class="skills-label">Skills:</b>
        ${skills.map(skill => `<span class="skill-tag-employer">${skill}</span>`).join("")}
      </div>

      <!-- JOB HIGHLIGHTS -->
      <div class="job-highlights">
        <b>Job Highlights:</b>
        ${job.highlights || "<p>No highlights provided</p>"}
      </div>

      <!-- JOB DESCRIPTION -->
      <div class="job-desc-employer">
        <b>Job Description:</b>
        ${job.description || "No job description provided"}
      </div>

      <div class="role-details">
        <b>Role Details:</b>
          <p><b>Industry:</b> ${job.industry || "Not specified"}</p>
          <p><b>Department:</b> ${job.department || "Not specified"}</p>
          <p><b>Type:</b> ${job.jobType || "Not specified"}</p>
          <p><b>Category:</b> ${job.category || "Not specified"}</p>
      </div>

      <div class="education-job-employer">
        <b>Education:</b> ${job.education ? job.education : "Not specified"}
      </div>

      <button class="delete-btn-employer" onclick="deleteJob(${job.id})">
        Delete Job
      </button>

      <button class="view-btn-employer" onclick="viewApplicants(${job.id})">
        View Applicants
      </button>

    `;

    container.appendChild(div);

  });

  } catch (err) {
    console.error(err);
    alert("Error loading jobs");
  }
}

/*----- 🔥 Delete job -----*/
async function deleteJob(id) {
  if (!confirm("Are you sure to delete this job?")) return;

  await fetch(`http://localhost:3000/jobs/${id}`, {
    method: "DELETE"
  });

  alert("Job Deleted ✅");

  loadEmployerJobs();
}



/* ================= VIEW APPLICANTS ================= */
async function viewApplicants(jobId) {

  currentJobId = jobId;

  applicantsList.innerHTML = "⏳ Loading applicants...";

  try {
    const res = await fetch(`http://localhost:3000/applicants/${jobId}`);

    if (!res.ok) throw new Error();

    const apps = await res.json();

    allApplicants = apps;

    displayApplicants(apps);

  } catch (err) {
    console.error(err);
    alert("❌ Failed to load applicants");
  }
}

/* ================= DISPLAY ================= */
function displayApplicants(apps) {

  applicantsList.innerHTML = "";

  applicantCount.innerText = `Total Applicants: ${apps.length}`;

  if (!apps.length) {
    applicantsList.innerHTML = "<p>No applicants found</p>";
    return;
  }

  apps.forEach(app => {

    const div = document.createElement("div");
    div.className = "applicant-card";

    div.innerHTML = `
      <div class="applicant-header">
        <h4><i class="fa-solid fa-user"></i> User ID: ${app.userId}</h4>
        <span class="status-badge ${app.status.toLowerCase()}">
          ${app.status}
        </span>
      </div>

      <p class="applicant-cal"><i class="fa-solid fa-calendar"></i> Applied On: ${new Date(app.appliedAt).toLocaleDateString()}</p>

      <a class="applicant-resume" href="http://localhost:3000${app.resume}" target="_blank">
        <i class="fa-solid fa-file"></i> View Resume
      </a>

      <br><br>

      <div class="status-container">
        <label>Update Status:</label>
        <select onchange="updateStatus(${app.id}, this)">
         <option value="APPLIED" ${app.status==="APPLIED"?"selected":""}>APPLIED</option>
         <option value="SHORTLISTED" ${app.status==="SHORTLISTED"?"selected":""}>SHORTLISTED</option>
         <option value="REJECTED" ${app.status==="REJECTED"?"selected":""}>REJECTED</option>
        </select>
    </div>

      <hr>
    `;

    applicantsList.appendChild(div);
  });
}


/* ================= FILTER ================= */
function filterApplicants(status) {

  if (status === "ALL") {
    displayApplicants(allApplicants);
  } else {
    const filtered = allApplicants.filter(a => a.status === status);
    displayApplicants(filtered);
  }
}


/* ================= UPDATE STATUS ================= */
async function updateStatus(id, select) {

  const status = select.value.trim();
  select.disabled = true;

  try {
    const res = await fetch(`http://localhost:3000/application/status`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, status })
    });

    if (!res.ok) throw new Error();

    alert("✅ Updated");

  } catch (err) {
    console.error(err); // 🔥 helpful debug
    alert("❌ Update failed");
  }

  select.disabled = false;

  viewApplicants(currentJobId);
}


window.onload = loadEmployerJobs;

</script>

  const descriptionQuill = new Quill('#descriptionEditor', {

    modules: {
      toolbar: [
        [{ 'header': [1, 2, false] }],
        ['bold', 'italic', 'underline'],

    }

</script>
