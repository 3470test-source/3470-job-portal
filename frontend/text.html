<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>



  <style>
.emp-home-v2 {
  padding: 20px;
  background: #f4f7fb;
  min-height: 100vh;
}

/* HERO */
.hero-section {
  background: linear-gradient(135deg, #0a66c2, #4f8ef7);
  color: white;
  padding: 40px;
  border-radius: 16px;
  text-align: center;
  margin-bottom: 25px;
}

.hero-section h1 {
  font-size: 32px;
  margin-bottom: 10px;
}

.hero-actions {
  margin-top: 20px;
  display: flex;
  justify-content: center;
  gap: 15px;
}

.hero-actions button {
  padding: 12px 18px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

.hero-actions button:first-child {
  background: white;
  color: #0a66c2;
}

.hero-actions button:last-child {
  background: #222;
  color: white;
}

/* FEATURE CARDS */
.feature-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
  gap: 20px;
  margin-bottom: 30px;
}

.feature-card {
  background: white;
  padding: 25px;
  border-radius: 14px;
  text-align: center;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
  transition: 0.3s;
}

.feature-card:hover {
  transform: translateY(-5px);
}

.feature-card i {
  font-size: 30px;
  color: #0a66c2;
  margin-bottom: 10px;
}

/* INSIGHTS */
.insight-section {
  display: flex;
  gap: 20px;
  justify-content: center;
  flex-wrap: wrap;
}

.insight-box {
  background: white;
  padding: 20px 40px;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

.insight-box h2 {
  color: #0a66c2;
  font-size: 30px;
}

  </style>


</head>
<body>








<div class="emp-home-v2">

  <!-- HERO SECTION -->
  <div class="hero-section">
    <h1>Hire the Right Talent Faster 🚀</h1>
    <p>Post jobs, track applicants, and manage hiring in one place.</p>

    <div class="hero-actions">
      <button onclick="goPostJob()">➕ Post a Job</button>
      <button onclick="goDashboard()">📊 Go to Dashboard</button>
    </div>
  </div>

  <!-- FEATURE CARDS -->
  <div class="feature-grid">

    <div class="feature-card">
      <i class="fa-solid fa-briefcase"></i>
      <h3>Post Jobs</h3>
      <p>Create and publish job openings instantly.</p>
    </div>

    <div class="feature-card">
      <i class="fa-solid fa-users"></i>
      <h3>Find Candidates</h3>
      <p>View and filter applicants easily.</p>
    </div>

    <div class="feature-card">
      <i class="fa-solid fa-chart-line"></i>
      <h3>Track Performance</h3>
      <p>Monitor job views and applications.</p>
    </div>

  </div>

  <!-- QUICK INSIGHTS -->
  <div class="insight-section">

    <div class="insight-box">
      <h2 id="jobsCount">0</h2>
      <p>Active Jobs</p>
    </div>

    <div class="insight-box">
      <h2 id="appCount">0</h2>
      <p>Total Applications</p>
    </div>

  </div>

</div>


<script>
    async function loadEmployerHomeV2() {

  const jobs = await (await fetch("http://localhost:3000/jobs")).json();
  const apps = await (await fetch("http://localhost:3000/applicants/all")).json();

  document.getElementById("jobsCount").innerText = jobs.length;
  document.getElementById("appCount").innerText = apps.length;
}

window.onload = loadEmployerHomeV2;

function goPostJob() {
  window.location.href = "/frontend/employer_dashboard.html";
}

function goDashboard() {
  window.location.href = "/frontend/employer_dashboard.html";
}
</script>

    
</body>
</html>
