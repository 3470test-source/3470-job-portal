<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3470 Healthcare & Training Institutes Job portal - register Employer</title>

    <!-- Favicon -->
    <link rel="icon" href="/image/Logo3470-health3-removebg-preview.png" type="image/x-icon">
    
    <link rel="stylesheet" href="styles.css" />

    <!-- Font Awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

    </style>

</head>
<body>



  <div class="employer-register-wrapper">

  <!-- LEFT SIDE -->
  <div class="employer-register-left">
    <div class="employer-register-overlay">
      <h1>Start Hiring the Right Talent</h1>
      <p>Create your employer account and connect with skilled professionals faster.</p>

      <ul class="feature-list-emp-register">
        <li><i class="fa-solid fa-circle-check"></i> Create and manage job postings</li>
        <li><i class="fa-solid fa-circle-check"></i> Access a wide pool of verified candidates</li>
        <li><i class="fa-solid fa-circle-check"></i> Simplify your recruitment workflow</li>
      </ul>
    </div>
  </div>

  <!-- RIGHT SIDE -->
  <div class="employer-register-right">
    <div class="employer-register-box">
      <h2>Employer Register</h2>

      <form id="registerForm" class="employer-register-form">

        <input type="text" placeholder="Company Name" required>
        <input type="text" placeholder="Full Name" required>
        <input type="email" placeholder="Email Address" required>

        <!-- PASSWORD -->
        <div class="employer-register-password-field">
          <input type="password" id="password" placeholder="Create Password" required>
          <i class="fa-solid fa-eye" id="togglePassword"></i>
        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="employer-register-password-field">
          <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
          <i class="fa-solid fa-eye" id="toggleConfirmPassword"></i>
        </div>

        <button type="submit">Register</button>

        <p class="employer-login-link">
          Already have an account? <a href="/frontend/employer_login.html">Login</a>
        </p>

      </form>
    </div>
  </div>

</div>


<!-- Javascript --> 
<script src="/frontend/main.js" defer></script>       

<script>
function toggle(id, iconId) {
  const input = document.getElementById(id);
  const icon = document.getElementById(iconId);

  if (input.type === "password") {
    input.type = "text";
    icon.classList.replace("fa-eye", "fa-eye-slash");
  } else {
    input.type = "password";
    icon.classList.replace("fa-eye-slash", "fa-eye");
  }
}

document.getElementById("togglePassword")
  .addEventListener("click", () => toggle("password", "togglePassword"));

document.getElementById("toggleConfirmPassword")
  .addEventListener("click", () => toggle("confirmPassword", "toggleConfirmPassword"));
</script>

</body>
</html>
